general_settings:
  database_url: "os.environ/DATABASE_URL"
  # Suppress proxy range startup warnings
  trusted_proxy_ranges: []
  proxy_config_reload_interval_seconds: 30
  database_connection_pool_limit: 10    # per worker process
  proxy_batch_write_at: 60              # batch spend writes, avoids DB hot spot
  store_model_in_db: true
  store_prompts_in_spend_logs: true

model_list:
  - model_name: chatgpt/gpt-6.1-sol
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6.1-sol

  - model_name: chatgpt/gpt-6.1-terra
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6.1-terra

  - model_name: chatgpt/gpt-6-luna
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6-luna

  - model_name: openrouter/google/gemini-3.1-flash-image
    litellm_params:
      model: openrouter/google/gemini-3.1-flash-image
      api_key: "os.environ/OPENROUTER_API_KEY"
      # drop_params is needed for Open WebUI image edit support
      drop_params: true 

  - model_name: openrouter/deepseek/deepseek-v4.1-flash-1017 
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["wafer/mxfp4", "together", "inference-net/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: "deny"
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216
      supports_vision: true
      supports_function_calling: true
      supports_reasoning: true

  - model_name: phala/deepseek/deepseek-v4.1-flash-1017
    litellm_params:
      model: phala/deepseek/deepseek-v4.1-flash-1017
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216
      supports_vision: true
      supports_function_calling: true
      supports_reasoning: true
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000016
      cache_read_input_token_cost: 0.00000015

