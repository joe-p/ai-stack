general_settings:
  pass_through_endpoints:
    - path: "/phala"
      auth: true
      target: "http://phala-pap:4180"
      include_subpath: true
      headers:
        Authorization: "bearer os.environ/PHALA_API_KEY"
  database_url: "os.environ/DATABASE_URL"
  # Suppress proxy range startup warnings
  trusted_proxy_ranges: []
  proxy_config_reload_interval_seconds: 30
  database_connection_pool_limit: 10    # per worker process
  proxy_batch_write_at: 60              # batch spend writes, avoids DB hot spot
  disable_error_logs: True              # keep provider errors out of spend logs

model_list:
  - model_name: gemini-3.1-flash-image
    litellm_params:
      model: openrouter/google/gemini-3.1-flash-image
      api_key: "os.environ/OPENROUTER_API_KEY"
      # drop_params is needed for Open WebUI image edit support
      drop_params: true 
  - model_name: deepseek/deepseek-v4.1-flash-1017 
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["wafer/mxfp4", "together", "inference-net/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: "deny"
  - model_name: deepseek/deepseek-v4.1-flash-1017:phala
    litellm_params:
      model: deepseek/deepseek-v4.1-flash-1017
      api_base: http://phala-pap:4180 
      api_key: bearer os.environ/PHALA_API_KEY
    model_info:
      mode: chat

