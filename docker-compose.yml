volumes:
  dashboard-data:

services:
  model-proxy:
    build:
      context: ./model-proxy/
    restart: unless-stopped
    env_file:
      - .env.model-proxy
    volumes:
      - ./model-proxy.json:/etc/model-proxy/config.json:ro
      - ./model-proxy-keys.json:/data/model-proxy-keys.json:ro
      - ./codex:/data/codex
    ports:
      - "8080:8080"
    depends_on:
      model-proxy-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  model-proxy-dashboard:
    build:
      context: ./model-proxy/examples/dashboard
    image: model-proxy-dashboard:latest
    restart: unless-stopped
    volumes:
      - dashboard-data:/data
    ports:
      - "8787:8787"

  openwebui:
    # version: ^0\.\d+\.\d+$
    image: ghcr.io/open-webui/open-webui:0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
    ports:
      - "3005:8080"
    volumes:
      - ./volumes/open-webui:/app/backend/data
    environment:
      WEBUI_AUTH: False
      # Tells Open WebUI where to fetch its own uploaded assets internally
      WEBUI_URL: "http://127.0.0.1:8080"
      # Bypasses the internal network block so it can resolve /api/v1/files/...
      ENABLE_RAG_LOCAL_WEB_FETCH: "True"

  phala-pap:
    ports:
      - 4180:4180
    command: ["https://inference.phala.com", "--client-host", "phala-pap"]
    build:
      context: .
      dockerfile: images/pap.Dockerfile
      args:
        VERSION: 0.8.4

