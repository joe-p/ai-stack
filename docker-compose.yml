volumes:
  litellm-pgdata:

services:
  openwebui:
    # version: ^0\.\d+\.\d+$
    image: ghcr.io/open-webui/open-webui:0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09
    ports:
      - "3005:8080"
    volumes:
      - ./volumes/open-webui:/app/backend/data
    environment:
      WEBUI_AUTH: False
      # Tells Open WebUI where to fetch its own uploaded assets internally
      WEBUI_URL: "http://127.0.0.1:8080"
      # Bypasses the internal network block so it can resolve /api/v1/files/...
      ENABLE_RAG_LOCAL_WEB_FETCH: "True"
  litellm:
    # version: ^v1\.\d+\.\d+$
    image: litellm/litellm:v1.108.1@sha256:562251f032a0075a5e5a775b8f44aa9f9f1e93d16562892565f29bfa23fbf2f6
    environment:
      LITELLM_MODE: PRODUCTION
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD:?required}@litellm-postgres:5432/litellm
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?required}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?required}
      PHALA_API_KEY: ${PHALA_API_KEY:?required}
    ports:
      - 4000:4000
    volumes:
      - ./litellm-config.yaml:/app/config.yaml # Mount the local configuration file
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      litellm-postgres:
        condition: service_healthy
  litellm-postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: litellm
      # deterministic initdb; avoids locale surprises on fresh volumes
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "5432"
  phala-pap:
    ports:
      - 4180:4180
    command: ["https://inference.phala.com", "--client-host", "phala-pap"]
    build:
      context: .
      dockerfile: images/pap.Dockerfile
      args:
        VERSION: 0.8.4
  
